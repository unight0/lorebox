# gitbox.yml
# The singular and only config file for gitbox

# Root directory for storing repositories
root: "."

# Listen for incoming connections at host:port. No host/0.0.0.0 for any source
# address, 127.0.0.1 or [::1] for loopback-only
# Default port is 8080 for demonstration purposes. I advise either:
# a) Run gitbox on a bare chosen unique port, enable HTTPS
# b) If 443 is not taken, run gitbox there, enable HTTPS
# c) Route through your HTTPS server running at 443 + use a subdomain like
# box.bob.me. Disable HTTPS, gitbox never has to touch TLS certificates
listen: "127.0.0.1:8080"

# Options:
# all -- need auth for any action
# new -- need auth only for fetching new (uncached) repos
# none -- no auth. Dangerous, don't use unless you know what you are doing
auth: "new"

# Time syntax:
# Xd, Xh, Xm, Xs -- X days, hours, minutes, seconds
timeouts:
  git: 5m
  refresh:
    default: 12h
    max: 20d
    # Refresh is randomized within these margins
    jitter:
      min: 20m
      max: 50m

# Authentication tokens
# Have form of <id>:<hash>
# Create with gitbox -gen-token
tokens:
  - "id-XYv1wQ:xY3QH-S8usyQVIOIRfTU8q78DLKLNsI5fI9Lj3btGdA"

https:
 certificate: "cert.pem"
 key: "key.pem"
