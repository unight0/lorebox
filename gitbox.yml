# gitbox.yml
# The singular and only config file for gitbox

# Root directory for storing repositories
root: "."

# Listen for incoming connections at host:port. No host/0.0.0.0 for any source
# address, 127.0.0.1 or [::1] for loopback-only
listen: ":8080"

# Options:
# all -- need auth for any action
# new -- need auth only for fetching new (uncached) repos
# none -- no auth. Dangerous, don't use unless you know what you are doing
auth: "none"

# Time syntax:
# Xd, Xh, Xm, Xs -- X days, hours, minutes, seconds
timeouts:
  git: 5m
  refresh:
    default: 12h
    max: 20d
    # Refresh is randomized within these margins
    jitter:
      min: 20m
      max: 50m

# Authentication tokens
# Have form of <id>:<hash>
# Create with gitbox -gen-token
tokens:
  - "id-esfPfw:5MsdBkAD538XSV2EVEPpIU7Qxk3uU3H0mF-j0ZGkwtE"

